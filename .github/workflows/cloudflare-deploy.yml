name: Community App Cloudflare Deploy

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  deploy:
    name: Build, release, and deploy to Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/community-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure cloudflare-deploy branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/cloudflare-deploy" ]; then
            echo "This workflow only runs for the cloudflare-deploy branch."
            echo "Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Disable local .npmrc for CI
        run: |
          if [ -f .npmrc ]; then mv .npmrc .npmrc.local-ci; fi

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.4.0'

      - name: Determine Version
        id: version_step
        uses: gittools/actions/gitversion/execute@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: web/community-web/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_APP_VERSION: ${{ steps.version_step.outputs.semVer }}
          VITE_API_APP_NAME: ${{ vars.VITE_API_APP_NAME }}
          VITE_API_KEY_NAME: ${{ vars.VITE_API_KEY_NAME }}
          VITE_API_KEY_VALUE: ${{ secrets.VITE_API_KEY_VALUE }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_ADDITIONAL_HEADERS: ${{ secrets.VITE_API_ADDITIONAL_HEADERS }}

      - name: Create zip archive
        run: |
          cd dist
          zip -r "$GITHUB_WORKSPACE/community-web-dist.zip" .

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create -t "v${{ steps.version_step.outputs.semVer }}-cloudflare" --generate-notes "v${{ steps.version_step.outputs.semVer }}-cloudflare" "$GITHUB_WORKSPACE/community-web-dist.zip#package"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch cloudflare-deploy
